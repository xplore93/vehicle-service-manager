add_service_entry:
  name: Add service entry
  description: >
    Adds a service entry to the vehicle history and updates the last service
    date for the given service points.
  fields:
    vehicle_id:
      name: Vehicle ID
      description: The internal UUID of the vehicle (from the entity attributes).
      required: true
      selector:
        text:
    entry_date:
      name: Date
      description: Date of the service (format YYYY-MM-DD).
      required: true
      selector:
        date:
    km:
      name: Mileage
      description: Mileage at the time of the service.
      required: true
      selector:
        number:
          min: 0
          max: 9999999
          unit_of_measurement: km
    services:
      name: Service points
      description: List of performed service points (e.g. ["oil", "inspection"]).
      required: true
      selector:
        select:
          multiple: true
          options:
            - oil
            - inspection
            - brake_fluid
            - cabin_filter
            - air_filter
            - spark_plugs
            - fuel_filter
            - gearbox
            - haldex
            - ac
            - hu
    notes:
      name: Notes
      description: Optional notes about the service (e.g. workshop name).
      required: false
      selector:
        text:

update_km:
  name: Update mileage
  description: >
    Manually updates the mileage of a vehicle.
    (If a KM entity is configured, the value is taken from it automatically.)
  fields:
    vehicle_id:
      name: Vehicle ID
      description: The internal UUID of the vehicle.
      required: true
      selector:
        text:
    km:
      name: Mileage
      description: New mileage.
      required: true
      selector:
        number:
          min: 0
          max: 9999999
          unit_of_measurement: km

add_repair:
  name: Add repair
  description: Adds a repair or wear entry.
  fields:
    vehicle_id:
      name: Vehicle ID
      required: true
      selector:
        text:
    entry_date:
      name: Date
      required: true
      selector:
        date:
    km:
      name: Mileage
      required: true
      selector:
        number:
          min: 0
          max: 9999999
          unit_of_measurement: km
    category:
      name: Category
      required: true
      selector:
        select:
          options:
            - brakes_front
            - brakes_rear
            - brakes_full
            - discs_front
            - discs_rear
            - shock_front
            - shock_rear
            - timing_belt
            - battery
            - clutch
            - other
    description:
      name: Description
      required: false
      selector:
        text:
    cost:
      name: Cost (€)
      required: false
      selector:
        number:
          min: 0
          max: 99999
          unit_of_measurement: "€"

add_tire:
  name: Add tire set
  description: Records a new tire set.
  fields:
    vehicle_id:
      name: Vehicle ID
      required: true
      selector:
        text:
    entry_date:
      name: Date (mounted)
      required: true
      selector:
        date:
    km:
      name: Mileage when mounted
      required: true
      selector:
        number:
          min: 0
          max: 9999999
          unit_of_measurement: km
    type:
      name: Tire type
      required: true
      selector:
        select:
          options:
            - summer
            - winter
            - allseason
    axle:
      name: Axle
      required: true
      selector:
        select:
          options:
            - all
            - front
            - rear
    brand:
      name: Brand / manufacturer
      required: false
      selector:
        text:
    dot:
      name: DOT code (4 digits)
      required: false
      selector:
        text:
    vl:
      name: Tread depth front left (mm)
      required: false
      selector:
        number:
          min: 0
          max: 12
          step: 0.5
    vr:
      name: Tread depth front right (mm)
      required: false
      selector:
        number:
          min: 0
          max: 12
          step: 0.5
    hl:
      name: Tread depth rear left (mm)
      required: false
      selector:
        number:
          min: 0
          max: 12
          step: 0.5
    hr:
      name: Tread depth rear right (mm)
      required: false
      selector:
        number:
          min: 0
          max: 12
          step: 0.5
